# Внос на обявленията от ЦАИС ЕОП (data.egov.bg) в SharePoint — без Cloudflare Worker-а.
# Нужна е тайна MS_CERT_PRIVATE_KEY в Settings → Secrets and variables → Actions (стойността от worker/.dev.vars).
name: ЦАИС ЕОП внос

on:
  schedule:
    - cron: '0 9 * * *' # 11:00 или 12:00 българско време; АОП публикува деня около 08:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eop-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Внос
        working-directory: worker
        env:
          MS_CERT_PRIVATE_KEY: ${{ secrets.MS_CERT_PRIVATE_KEY }}
        run: node scripts/eop-import.mjs
