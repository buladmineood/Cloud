name = "buladmin-cloud-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "cloud.buladmin.eu/api/*", zone_name = "buladmin.eu" }]

# Тайните НЕ са тук. Качват се с `npm run secrets` от worker/.dev.vars; виж docs/SETUP.md.
[vars]
APP_ORIGIN = "https://cloud.buladmin.eu"
SP_HOSTNAME = "bulmaileu.sharepoint.com"
SP_SITE_PATH = "/sites/cloud"
# Собственик на автоматично създаваните сайтове на фирмите (/sites/cloud-<id>).
SP_SITE_OWNER = "cvetkov@bulmail.eu"
GRAPH_TENANT_ID = "16d24843-7704-4206-87f4-bc20073547ac"
GOOGLE_CLIENT_ID = "330949049619-gm550u4mq9qtd7gc2tj8bd55cc86g23s.apps.googleusercontent.com"
MS_CLIENT_ID = "0f8a9dda-96cf-44ef-a92d-34804ad51d18"
MS_CERT_THUMBPRINT = "bj_ulRIfr8ADQUzNsS7q5wWRc_7WqSG9ZOQz1yDl_z8"
# Кутията в MAIL_FROM има право да праща само от себе си (scripts/setup-mail.ps1, Exchange RBAC).
MAIL_ENABLED = "true"
MAIL_FROM = "no-reply@cloud.buladmin.eu"

# Ограничение на опитите за вход и линкове: до 20 заявки в минута от един IP адрес за всеки вид.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Ежедневни напомняния по имейл в 6:00 UTC (8:00 или 9:00 българско време).
# Обявленията от ЦАИС ЕОП не минават оттук: внася ги GitHub Actions (.github/workflows/eop-import.yml).
[triggers]
crons = ["0 6 * * *"]
